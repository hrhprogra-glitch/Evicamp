<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiuMax Comerc - Sin conexión</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #1E293B; color: #F8FAFC; padding: 16px; box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center;
    }
    .caja { border: 2px solid #10B981; padding: 32px 24px; max-width: 420px; box-shadow: 6px 6px 0 0 #10B981; }
    h1 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0.15em; text-transform: uppercase; color: #10B981; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; }
    button {
      background: #10B981; color: #1E293B; border: 2px solid #F8FAFC; padding: 12px 20px;
      font: inherit; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Sin conexión</h1>
    <p>SiuMax Comerc necesita internet para funcionar. Revisa tu conexión y vuelve a intentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
