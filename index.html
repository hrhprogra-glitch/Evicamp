<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App instalable (PWA): nombre, ícono y color de la barra -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E293B" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SiuMax Nego" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <meta name="google" content="notranslate" />
    
    <title>SiuMax Nego</title>
    <script>
      (function() {
        try {
          // El sitio oficial de ECO SISTEMAS URH arranca en Océano; los demás, en Clásico.
          // Si el dispositivo ya eligió un tema, esa elección se respeta.
          var esOficial = /^(www\.)?ecosistema123\.duckdns\.org$/i.test(location.hostname);
          window.SIUMAX_TEMA_PREDETERMINADO = esOficial ? 'oceano' : 'classic';
          window.SIUMAX_NOMBRE_SITIO = esOficial ? 'ECO SISTEMAS URH' : 'SiuMax Nego';
          if (esOficial) {
            // Marca permanente del sitio oficial: solo aquí el Modo Oscuro usa azul en vez de verde.
            document.documentElement.classList.add('sitio-ecosistema');
            document.title = window.SIUMAX_NOMBRE_SITIO;
            var apple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (apple) apple.setAttribute('content', window.SIUMAX_NOMBRE_SITIO);
            var manifest = document.querySelector('link[rel="manifest"]');
            if (manifest) manifest.setAttribute('href', '/manifest-ecosistema.json');
          }
          var tema = localStorage.getItem('gestorpro_theme') || window.SIUMAX_TEMA_PREDETERMINADO;
          if (tema === 'monochrome' || tema === 'dark') {
            document.documentElement.classList.add('theme-monochrome');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (tema && tema !== 'classic') {
            document.documentElement.setAttribute('data-theme', tema);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
